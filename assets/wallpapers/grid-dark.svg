<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#080810"/>
  <!-- Grid lines -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(124,106,247,0.08)" stroke-width="1"/>
    </pattern>
    <pattern id="grid-large" width="300" height="300" patternUnits="userSpaceOnUse">
      <path d="M 300 0 L 0 0 0 300" fill="none" stroke="rgba(124,106,247,0.12)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#grid-large)"/>
  <!-- Corner glow -->
  <radialGradient id="cg" cx="0%" cy="0%" r="60%">
    <stop offset="0%" stop-color="#7c6af7" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#7c6af7" stop-opacity="0"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#cg)"/>
</svg>
