apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "chat-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "chat-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: dkubex
  hostnames:
    - {{ .Values.hostname | default "*" | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.basePath }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: cookie-auth
      backendRefs:
        - name: {{ include "chat-app.fullname" . }}
          port: {{ .Values.service.port }}
