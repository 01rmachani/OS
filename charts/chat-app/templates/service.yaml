apiVersion: v1
kind: Service
metadata:
  name: {{ include "chat-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "chat-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "chat-app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 3000
      protocol: TCP
